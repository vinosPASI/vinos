version: '3.8'

services:
  # ── Backend Node.js (Express) ──
  backend:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: smartwinery_backend
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin_winery}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-SmartPassword123!}
      PORT: "8080"
      ML_MODELS_URL: "http://host.docker.internal:11434"
      VISION_LLM_MODEL: "qwen2.5vl:3b"
    ports:
      - "8080:8080"
    depends_on:
      - pocketbase
      - minio
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── PocketBase (Auth & DB) ──
  pocketbase:
    build:
      context: ../../build/package
      dockerfile: Dockerfile.pocketbase
    container_name: smartwinery_pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

  # ── MinIO (Object Storage) ──
  minio:
    image: quay.io/minio/minio:latest
    container_name: smartwinery_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_winery}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SmartPassword123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ── Cloudflare Tunnel (expone winery-api.stuko.dev) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartwinery_tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pb_data:
  minio_data:
